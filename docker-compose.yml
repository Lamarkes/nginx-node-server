

networks:
  nginx_net:
    driver: bridge

services:

  nginx:
    image: nginx
    ports:
      - 8085:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - nginx_net

  nodeserver:
    build: ./services/app-hello
    networks:
      - nginx_net
  
  nodetime:
    build: ./services/app-time
    networks:
      - nginx_net
  
  nodeuser:
    build: ./services/app-api
    networks:
      - nginx_net
